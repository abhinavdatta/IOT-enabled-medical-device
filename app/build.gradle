plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.waterbench.controller'
    compileSdk 34

    defaultConfig {
        applicationId "com.waterbench.controller"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
        resValue "string", "app_name", "WaterBench Controller"
    }

    signingConfigs {
        release {
            // Keep release credentials out of source control. Set these on the
            // build machine/CI; the keystore path should point outside this repo.
            storeFile file(System.getenv('WATERBENCH_RELEASE_STORE_FILE') ?: 'keystores/UNCONFIGURED.keystore')
            storePassword System.getenv('WATERBENCH_RELEASE_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('WATERBENCH_RELEASE_KEY_ALIAS') ?: ''
            keyPassword System.getenv('WATERBENCH_RELEASE_KEY_PASSWORD') ?: ''
            // Full modern signature coverage (v1 JAR + v2 + v3) so package
            // verifiers and Play Protect see a completely signed release APK.
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.google.code.gson:gson:2.10.1'
}
